name: Backend Rule Regression

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  rule-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run rule regression suite
        run: ./scripts/run_rule_regression_tests.sh
