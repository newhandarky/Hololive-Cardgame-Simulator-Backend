spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/holocardgame_db
    username: holocard_user
    password: holocard_password
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
line:
  channel-id: ${LINE_CHANNEL_ID:YOUR_LINE_CHANNEL_ID}
jwt:
  secret: ${JWT_SECRET:change-me-jwt-secret-at-least-32-bytes-long-for-dev-only}
  expiration: 86400000
server:
  port: ${PORT:8080}
  error:
    include-message: always
