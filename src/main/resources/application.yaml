spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/holocardgame_db}
    username: ${SPRING_DATASOURCE_USERNAME:holocard_user}
    password: ${SPRING_DATASOURCE_PASSWORD:holocard_password}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/holocardgame_db}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:holocard_user}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:holocard_password}}
    connect-retries: ${SPRING_FLYWAY_CONNECT_RETRIES:3}

line:
  channel-id: ${LINE_CHANNEL_ID:YOUR_LINE_CHANNEL_ID}

jwt:
  secret: ${JWT_SECRET:change-me-jwt-secret-at-least-32-bytes-long-for-dev-only}
  expiration: 86400000

server:
  port: ${PORT:8080}
  error:
    include-message: always
